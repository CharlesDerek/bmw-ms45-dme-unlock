name: CI

on:
  push:
    branches:
      - main
      - master
      - development
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show active-toolchain

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Test read-only job bridge
        run: python -m unittest discover -s scripts -p 'test_ms45_read_bridge.py'

      - name: Test release packager
        run: python -m unittest discover -s scripts/release -p 'test_*.py'

  opentofu:
    name: OpenTofu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Validate Kubernetes module
        run: scripts/ci/opentofu-validate.sh
